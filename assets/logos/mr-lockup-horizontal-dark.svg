<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 72" width="520" height="72" role="img" aria-label="michelle.research horizontal lockup — dark">
  <title>michelle.research — Horizontal Lockup (Dark / Plum)</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@600&amp;display=swap');
    </style>
  </defs>

  <!-- Background: Plum -->
  <rect width="520" height="72" fill="#3F2A52"/>

  <!-- Split M mark — cream on plum -->
  <g transform="translate(20, 14) scale(0.5238)">
    <polygon points="0,84 0,0 26,0 50,37 50,63 24,33 24,84" fill="#EEE9DF"/>
    <polygon points="104,84 104,0 78,0 54,37 54,63 80,33 80,84" fill="#EEE9DF"/>
  </g>

  <!-- Divider hairline -->
  <line x1="90" y1="12" x2="90" y2="60" stroke="#EEE9DF" stroke-width="1" opacity="0.2"/>

  <!-- Wordmark: cream + gold period -->
  <text font-family="'IBM Plex Serif', Georgia, serif" font-weight="600" font-size="32" letter-spacing="-0.4">
    <tspan x="106" y="47" fill="#EEE9DF">michelle</tspan><tspan fill="#FFB162" dx="2" letter-spacing="0">.</tspan><tspan fill="#EEE9DF" dx="2" letter-spacing="-0.4">research</tspan>
  </text>
</svg>
