      .label { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 500; }
    </style>
  </defs>

  <!-- ══ SHEET BACKGROUND ══════════════════════════════ -->
  <rect width="640" height="860" fill="#EEE9DF"/>

  <!-- ══ HEADER ════════════════════════════════════════ -->
  <text x="32" y="44" font-family="'IBM Plex Serif', Georgia, serif" font-weight="600" font-size="13" fill="#A35139" letter-spacing="0.22em" text-transform="uppercase">michelle.research · Logo System v1.0</text>
  <line x1="32" y1="56" x2="608" y2="56" stroke="#3F2A52" stroke-width="1" opacity="0.14"/>

  <!-- ══ SECTION 01 — MARK ONLY ════════════════════════ -->
  <text x="32" y="90" class="label" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" fill="#A35139" letter-spacing="0.22em">01 — MARK ONLY</text>

  <!-- Mark: Plum on Cream -->
  <rect x="32" y="104" width="176" height="140" fill="#EEE9DF" stroke="#3F2A52" stroke-width="1" stroke-opacity="0.14"/>
  <g transform="translate(84, 130) scale(0.714)"><!-- 60px height: 84*0.714=60 -->
    <polygon points="0,84 0,0 26,0 50,37 50,63 24,33 24,84" fill="#3F2A52"/>
    <polygon points="104,84 104,0 78,0 54,37 54,63 80,33 80,84" fill="#3F2A52"/>
  </g>
  <text x="120" y="232" text-anchor="middle" class="label" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" fill="#3A2D34" opacity="0.6" letter-spacing="0.06em">Plum on Cream</text>

  <!-- Mark: Cream on Plum -->
  <rect x="232" y="104" width="176" height="140" fill="#3F2A52"/>
  <g transform="translate(284, 130) scale(0.714)">
