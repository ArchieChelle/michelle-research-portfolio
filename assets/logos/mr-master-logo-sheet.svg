  <!-- ══ FOOTER ════════════════════════════════════════ -->
  <line x1="32" y1="840" x2="608" y2="840" stroke="#3F2A52" stroke-width="1" opacity="0.14"/>
  <text x="32" y="856" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" fill="#3A2D34" opacity="0.5" letter-spacing="0.06em">michelle.research · Logo System v1.0 · 2026 · Master SVG — do not redraw manually</text>
