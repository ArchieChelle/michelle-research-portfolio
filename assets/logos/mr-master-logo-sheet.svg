  <text x="172" y="776" text-anchor="middle" font-family="'IBM Plex Serif', Georgia, serif" font-weight="600" font-size="20" letter-spacing="-0.3">
    <tspan fill="#3F2A52">michelle</tspan><tspan fill="#A35139" dx="2" letter-spacing="0">.</tspan><tspan fill="#3F2A52" dx="2" letter-spacing="-0.3">research</tspan>
  </text>

