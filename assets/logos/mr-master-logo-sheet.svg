    <polygon points="104,84 104,0 78,0 54,37 54,63 80,33 80,84" fill="#EEE9DF"/>
  </g>
  <text x="320" y="232" text-anchor="middle" class="label" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" fill="#EEE9DF" opacity="0.6" letter-spacing="0.06em">Cream on Plum</text>

