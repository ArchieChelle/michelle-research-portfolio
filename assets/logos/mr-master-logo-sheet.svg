  <text font-family="'IBM Plex Serif', Georgia, serif" font-weight="600" font-size="30" letter-spacing="-0.4">
    <tspan x="132" y="538" fill="#FFFFFF">michelle</tspan><tspan fill="#FFB162" dx="2" letter-spacing="0">.</tspan><tspan fill="#FFFFFF" dx="2" letter-spacing="-0.4">research</tspan>
  </text>

