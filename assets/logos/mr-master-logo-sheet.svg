    <polygon points="104,84 104,0 78,0 54,37 54,63 80,33 80,84" fill="#EEE9DF"/>
  </g>
  <text x="468" y="776" text-anchor="middle" font-family="'IBM Plex Serif', Georgia, serif" font-weight="600" font-size="20" letter-spacing="-0.3">
    <tspan fill="#EEE9DF">michelle</tspan><tspan fill="#FFB162" dx="2" letter-spacing="0">.</tspan><tspan fill="#EEE9DF" dx="2" letter-spacing="-0.3">research</tspan>
